<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panduan Isyarat SignLink</title>
<style>
  :root { --bg:#111318; --card:#1b1e26; --line:#2c303c; --text:#eceef2; --muted:#8b91a0; --accent:#50c88c; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 "Segoe UI", system-ui, sans-serif; }
  header { position:sticky; top:0; z-index:2; display:flex; flex-wrap:wrap; gap:12px 20px; align-items:center;
    padding:18px 28px; background:rgba(17,19,24,.92); backdrop-filter:blur(8px); border-bottom:1px solid var(--line); }
  h1 { margin:0; font-size:22px; }
  header p { margin:0; color:var(--muted); font-size:13px; flex-basis:100%; }
  input[type=search] { flex:1; min-width:200px; max-width:320px; padding:9px 14px; border-radius:10px;
    border:1px solid var(--line); background:var(--card); color:var(--text); font:inherit; }
  label { display:flex; gap:8px; align-items:center; color:var(--muted); font-size:14px; cursor:pointer; }
  main { display:grid; grid-template-columns:repeat(auto-fill, minmax(340px, 1fr)); gap:18px; padding:24px 28px 40px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; overflow:hidden; }
  .card h2 { display:flex; align-items:baseline; gap:10px; margin:0; padding:12px 16px; font-size:19px; }
  .card h2 span { color:var(--muted); font-size:13px; font-weight:400; }
  .clips { display:grid; grid-template-columns:1fr 1fr; gap:2px; background:#000; }
  video { width:100%; aspect-ratio:1/1; object-fit:cover; display:block; background:#000; }
  body.mirror video { transform:scaleX(-1); }
  .empty { grid-column:1/-1; color:var(--muted); text-align:center; padding:40px; }
  @media (max-width:420px) { header, main { padding-left:16px; padding-right:16px; } main { grid-template-columns:1fr; } }
</style>
</head>
<body>
<header>
  <h1>Panduan Isyarat</h1>
  <input type="search" id="q" placeholder="Cari kata…" autocomplete="off">
  <label><input type="checkbox" id="mirror" checked> Mode cermin</label>
  <p>32 kata WL-BISINDO, dua peraga per kata. Mode cermin membalik video seperti cermin, jadi tiru saja gerakannya dengan tangan yang sama di layar.
     Video: dataset WL-BISINDO (CC BY-NC 4.0).</p>
</header>
<main id="grid"></main>
<script>
const words = [{"no": 1, "word": "Air", "clips": ["video/signer1_label0_sample1.mp4", "video/signer3_label0_sample1.mp4"]}, {"no": 2, "word": "Belajar", "clips": ["video/signer1_label1_sample1.mp4", "video/signer3_label1_sample1.mp4"]}, {"no": 3, "word": "Cari", "clips": ["video/signer1_label2_sample1.mp4", "video/signer3_label2_sample1.mp4"]}, {"no": 4, "word": "Hari", "clips": ["video/signer1_label3_sample1.mp4", "video/signer3_label3_sample1.mp4"]}, {"no": 5, "word": "Ingat", "clips": ["video/signer1_label4_sample1.mp4", "video/signer3_label4_sample1.mp4"]}, {"no": 6, "word": "Lagi", "clips": ["video/signer1_label5_sample1.mp4", "video/signer3_label5_sample1.mp4"]}, {"no": 7, "word": "Maaf", "clips": ["video/signer1_label6_sample1.mp4", "video/signer3_label6_sample1.mp4"]}, {"no": 8, "word": "Makan", "clips": ["video/signer1_label7_sample1.mp4", "video/signer3_label7_sample1.mp4"]}, {"no": 9, "word": "Motor", "clips": ["video/signer1_label8_sample1.mp4", "video/signer3_label8_sample1.mp4"]}, {"no": 10, "word": "Saya", "clips": ["video/signer1_label9_sample1.mp4", "video/signer3_label9_sample1.mp4"]}, {"no": 11, "word": "Terima kasih", "clips": ["video/signer1_label10_sample1.mp4", "video/signer3_label10_sample1.mp4"]}, {"no": 12, "word": "Tuli", "clips": ["video/signer1_label11_sample1.mp4", "video/signer3_label11_sample1.mp4"]}, {"no": 13, "word": "Apa", "clips": ["video/signer1_label12_sample1.mp4", "video/signer3_label12_sample1.mp4"]}, {"no": 14, "word": "Siapa", "clips": ["video/signer1_label13_sample1.mp4", "video/signer3_label13_sample1.mp4"]}, {"no": 15, "word": "Kapan", "clips": ["video/signer1_label14_sample1.mp4", "video/signer3_label14_sample1.mp4"]}, {"no": 16, "word": "Di mana", "clips": ["video/signer1_label15_sample1.mp4", "video/signer3_label15_sample1.mp4"]}, {"no": 17, "word": "Mengapa", "clips": ["video/signer1_label16_sample1.mp4", "video/signer3_label16_sample1.mp4"]}, {"no": 18, "word": "Bagaimana", "clips": ["video/signer1_label17_sample1.mp4", "video/signer3_label17_sample1.mp4"]}, {"no": 19, "word": "Merah", "clips": ["video/signer1_label18_sample1.mp4", "video/signer3_label18_sample1.mp4"]}, {"no": 20, "word": "Kuning", "clips": ["video/signer1_label19_sample1.mp4", "video/signer3_label19_sample1.mp4"]}, {"no": 21, "word": "Hijau", "clips": ["video/signer1_label20_sample1.mp4", "video/signer3_label20_sample1.mp4"]}, {"no": 22, "word": "Hitam", "clips": ["video/signer1_label21_sample1.mp4", "video/signer3_label21_sample1.mp4"]}, {"no": 23, "word": "Dengar", "clips": ["video/signer1_label22_sample1.mp4", "video/signer3_label22_sample1.mp4"]}, {"no": 24, "word": "Berangkat", "clips": ["video/signer1_label23_sample1.mp4", "video/signer3_label23_sample1.mp4"]}, {"no": 25, "word": "Datang", "clips": ["video/signer1_label24_sample1.mp4", "video/signer3_label24_sample1.mp4"]}, {"no": 26, "word": "Teman", "clips": ["video/signer1_label25_sample1.mp4", "video/signer3_label25_sample1.mp4"]}, {"no": 27, "word": "Keluarga", "clips": ["video/signer1_label26_sample1.mp4", "video/signer3_label26_sample1.mp4"]}, {"no": 28, "word": "Rumah", "clips": ["video/signer1_label27_sample1.mp4", "video/signer3_label27_sample1.mp4"]}, {"no": 29, "word": "Pagi", "clips": ["video/signer1_label28_sample1.mp4", "video/signer3_label28_sample1.mp4"]}, {"no": 30, "word": "Siang", "clips": ["video/signer1_label29_sample1.mp4", "video/signer3_label29_sample1.mp4"]}, {"no": 31, "word": "Sore", "clips": ["video/signer1_label30_sample1.mp4", "video/signer3_label30_sample1.mp4"]}, {"no": 32, "word": "Malam", "clips": ["video/signer1_label31_sample1.mp4", "video/signer3_label31_sample1.mp4"]}];
const grid = document.getElementById('grid');
const q = document.getElementById('q');
const mirror = document.getElementById('mirror');

// Video hanya diputar saat terlihat di layar, supaya 64 video tidak jalan bersamaan.
const io = new IntersectionObserver((entries) => entries.forEach((e) => (e.isIntersecting ? e.target.play().catch(() => {}) : e.target.pause())));

for (const w of words) {
  const card = document.createElement('article');
  card.className = 'card';
  card.dataset.word = w.word.toLowerCase();
  const h = document.createElement('h2');
  h.textContent = w.word;
  const no = document.createElement('span');
  no.textContent = '#' + w.no;
  h.append(no);
  const clips = document.createElement('div');
  clips.className = 'clips';
  for (const src of w.clips) {
    const v = document.createElement('video');
    Object.assign(v, { src, muted: true, loop: true, playsInline: true, preload: 'metadata' });
    clips.append(v);
    io.observe(v);
  }
  card.append(h, clips);
  grid.append(card);
}

const empty = document.createElement('p');
empty.className = 'empty';
empty.textContent = 'Kata tidak ada di daftar.';
q.addEventListener('input', () => {
  const s = q.value.trim().toLowerCase();
  let shown = 0;
  for (const c of grid.querySelectorAll('.card')) {
    const hit = c.dataset.word.includes(s);
    c.hidden = !hit;
    shown += hit;
  }
  if (!shown) grid.append(empty); else empty.remove();
});
const setMirror = () => document.body.classList.toggle('mirror', mirror.checked);
mirror.addEventListener('change', setMirror);
setMirror();
</script>
</body>
</html>
